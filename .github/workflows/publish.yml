name: Publish glirastes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs before anything is published (the image push and the npm publish both need it).
  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Release flow: unreleased notes are merged into upgrade-notes/<version>.json first.
      # A prerelease needs its own file too (upgrade-notes/<x.y.z-rc.n>.json, `notes: []` is fine).
      - name: Verify upgrade notes are released for this version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if ls upgrade-notes/unreleased/*.json >/dev/null 2>&1; then
            echo "::error::upgrade-notes/unreleased/ still holds notes; merge them into upgrade-notes/$PKG_VERSION.json"
            exit 1
          fi
          if [ ! -f "upgrade-notes/$PKG_VERSION.json" ]; then
            echo "::error::upgrade-notes/$PKG_VERSION.json is missing"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun run release:prepare refreshes the snapshot; a release commit without it fails here.
      - name: Verify the api-surface snapshot matches the source
        run: bun scripts/api-surface.ts --check
  runtime-container:
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/runtime-container.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
  # Local STT stage 1 (packed tarball, native addon, worker restart) on every supported platform.
  stt-local-addon:
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/stt-local-addon.yml
    permissions:
      contents: read
  publish:
    needs: [release-preflight, runtime-container, stt-local-addon]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.release-preflight.result == 'success' && needs.runtime-container.result == 'success' && needs.stt-local-addon.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node (for npm publish + provenance)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.
      # Pinned to 11: npm@latest (12) dropped Node 20 and may drop more.
      - name: Upgrade npm (for OIDC trusted publishing)
        run: npm install -g npm@11

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:tests

      # The suite boots the built SDK (pack completeness, reference apps).
      - name: Build
        run: bun run build

      - name: Install the NestJS fixture API
        run: bun install --frozen-lockfile --cwd examples/react-nest-separate/api

      # pg at the floor of the declared range, for the plain-Node import test.
      - name: Install the pg floor fixture
        run: bun install --frozen-lockfile --cwd tests/fixtures/pg-floor

      # zod 3.25 (classic and its zod/v4 build), for the chat views tests on zod 3.
      - name: Install the zod 3 fixture
        run: bun install --frozen-lockfile --cwd tests/fixtures/zod3

      - name: Test
        run: bun run test

      # Auth is via GitHub OIDC (Trusted Publishing) — no token needed.
      # Configure the trusted publisher for this repo + workflow on npmjs.com:
      # npm package → Settings → Trusted Publisher → GitHub Actions.
      # Prereleases (x.y.z-id.n) go to the `next` dist-tag so `latest` stays on the stable line.
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --tag "$(node -p "['latest', 'next'][Number(require('./package.json').version.includes('-'))]")"
  # The GitHub release follows the npm publish, with the CHANGELOG section as notes.
  github-release:
    needs: publish
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          if [ "$VERSION" != "${VERSION#*-}" ]; then
            gh release create "$TAG" --verify-tag --title "Glirastes $VERSION" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$TAG" --verify-tag --title "Glirastes $VERSION" --notes-file release-notes.md --latest
          fi
