name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The reference-app tests boot the built SDK and the NestJS fixture's own API dependencies.
      - name: Build
        run: bun run build

      - name: Install the NestJS fixture API
        run: bun install --frozen-lockfile --cwd examples/react-nest-separate/api

      # Without Python the Vue+FastAPI tests skip visibly here; the reference-fastapi job runs them.
      - name: Test
        run: bun run test

  reference-fastapi:
    name: Reference app Vue+FastAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the FastAPI fixture API
        run: python -m pip install -r examples/vue-fastapi/api/requirements.txt

      - name: Build
        run: bun run build

      - name: Vue+FastAPI change corpus
        env:
          GLIRASTES_REQUIRE_PYTHON: '1'
          GLIRASTES_TEST_PYTHON: python
        run: bunx vitest run tests/tool-sync-vue-fastapi.test.ts tests/tool-sync-vue-fastapi-ui.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Project uses bun.lock; npm audit needs an npm-style lockfile, so we
      # generate one on the fly without touching node_modules or running
      # install scripts.
      - name: Generate package-lock.json (prod deps only)
        run: npm install --package-lock-only --omit=dev --ignore-scripts

      # Surface high/critical advisories on production deps.
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
