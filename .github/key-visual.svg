<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="kv-title kv-desc">
  <title id="kv-title">Glirastes</title>
  <desc id="kv-desc">Let users operate your app through chat. A chat request calls the tool tasks.update, which comes from the app's own routes and UI actions. Everything runs inside your app. A CI tool agent describes tools on every pull request, and the optional Glirastes Platform handles signed revisions, rollouts and content-free telemetry.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #EEF0FF; }
    .soft { fill: #B4BBE6; }
    .mute { fill: #8189C0; }
    .corn { fill: #8FA8FF; }
    .sig { fill: #F5C451; }
    .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .beat { animation: beat 3.2s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .flow, .beat { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#F5C451" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8FA8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect width="1200" height="480" rx="22" fill="#12153A"/>
  <rect width="1200" height="480" rx="22" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="479" rx="21.5" fill="none" stroke="#2C3270"/>

  <!-- header -->
  <g class="sans">
    <path d="M56 52h10v10h-10z" fill="#F5C451"/>
    <path d="M70 52h10v10h-10z" fill="#8FA8FF"/>
    <path d="M70 66h10v10h-10z" fill="#8FA8FF" fill-opacity=".45"/>
    <text x="92" y="77" class="ink" font-size="40" font-weight="700" letter-spacing="-1">Glirastes</text>
    <text x="56" y="118" class="soft" font-size="19">Let users operate your app through chat. Tools come from your code, execution stays in your app.</text>
    <text x="1144" y="70" class="mute" font-size="15" text-anchor="end">TypeScript SDK by Chainmatics</text>
  </g>

  <!-- your app boundary -->
  <rect x="40" y="160" width="804" height="292" rx="16" fill="#171B47" fill-opacity=".55" stroke="#6E78C8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="56" y="150" width="482" height="22" fill="#12153A"/>
  <text x="66" y="167" class="sans" font-size="16"><tspan class="ink" font-weight="600">your app</tspan><tspan class="mute" dx="10">prompts, model calls, secrets, data and auth stay here</tspan></text>

  <!-- chat panel -->
  <g class="sans">
    <rect x="64" y="190" width="312" height="240" rx="12" fill="#0E1130" stroke="#2F3572"/>
    <circle cx="82" cy="208" r="4" fill="#2F3572"/>
    <circle cx="96" cy="208" r="4" fill="#2F3572"/>
    <text x="358" y="213" class="mute" font-size="14" text-anchor="end">in-app chat</text>
    <path d="M64 224H376" stroke="#2F3572"/>

    <!-- user bubble -->
    <rect x="114" y="238" width="246" height="36" rx="10" fill="#3A4598"/>
    <text x="128" y="262" class="ink" font-size="16">Move the Q4 report to Finance</text>

    <!-- tool call -->
    <rect x="80" y="288" width="280" height="72" rx="10" fill="#1A1E4A" stroke="#F5C451" stroke-opacity=".7"/>
    <text x="94" y="312" class="mute" font-size="14">calls tool</text>
    <text x="164" y="312" class="mono sig" font-size="16" font-weight="600">tasks.update</text>
    <text x="94" y="342" class="mono soft" font-size="14">{ id: "q4", list: "Finance" }</text>

    <!-- result -->
    <path d="M88 392l5 5 9-10" fill="none" stroke="#7FD6A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="398" class="ink" font-size="16">Moved to Finance.</text>
    <text x="112" y="418" class="mute" font-size="14">same session, same permissions</text>
  </g>

  <!-- connector chat -> tools -->
  <path d="M360 324H398V323H446" fill="none" stroke="#F5C451" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M360 324H446" fill="none" stroke="#12153A" stroke-width="2" class="flow" stroke-opacity=".9"/>

  <!-- tools panel -->
  <g class="sans">
    <rect x="452" y="190" width="372" height="240" rx="12" fill="#0E1130" stroke="#2F3572"/>
    <text x="470" y="213" class="ink" font-size="16" font-weight="600">Tools from your code</text>
    <text x="806" y="213" class="mute" font-size="14" text-anchor="end">discovered</text>
    <path d="M452 224H824" stroke="#2F3572"/>

    <g class="mono" font-size="15">
      <text x="470" y="256" class="corn" font-weight="600">GET</text>
      <text x="530" y="256" class="soft">/api/tasks</text>
      <text x="806" y="256" class="mute" text-anchor="end">tasks.list</text>

      <text x="470" y="292" class="corn" font-weight="600">POST</text>
      <text x="530" y="292" class="soft">/api/tasks</text>
      <text x="806" y="292" class="mute" text-anchor="end">tasks.create</text>

      <rect x="460" y="304" width="356" height="34" rx="7" fill="#F5C451" fill-opacity=".12" stroke="#F5C451" stroke-opacity=".55" class="beat"/>
      <text x="470" y="327" class="sig" font-weight="600">PATCH</text>
      <text x="530" y="327" class="ink">/api/tasks/:id</text>
      <text x="806" y="327" class="sig" text-anchor="end" font-weight="600">tasks.update</text>

      <text x="470" y="364" fill="#C9A6FF" font-weight="600">UI</text>
      <text x="530" y="364" class="soft">openTaskDialog()</text>
      <text x="806" y="364" class="mute" text-anchor="end">tasks.open</text>
    </g>
    <path d="M470 384H806" stroke="#2F3572"/>
    <text x="470" y="412" class="mute" font-size="14">routes and UI actions, typed from source</text>
  </g>

  <!-- outside: CI -->
  <g class="sans">
    <rect x="880" y="190" width="280" height="104" rx="12" fill="#12153A" stroke="#3A4180"/>
    <circle cx="902" cy="216" r="6" fill="none" stroke="#8FA8FF" stroke-width="2"/>
    <path d="M902 222V240M902 240a6 6 0 1 0 0.01 0" fill="none" stroke="#8FA8FF" stroke-width="2"/>
    <text x="920" y="221" class="ink" font-size="16" font-weight="600">CI tool agent</text>
    <text x="920" y="245" class="soft" font-size="15">describes tools on every</text>
    <text x="920" y="265" class="soft" font-size="15">pull request</text>
    <text x="920" y="283" class="mono mute" font-size="13">PR #128: 3 tools described</text>
  </g>
  <path d="M880 242H860V256H830" fill="none" stroke="#8FA8FF" stroke-width="1.5" marker-end="url(#am)"/>

  <!-- outside: platform -->
  <g class="sans">
    <rect x="880" y="326" width="280" height="104" rx="12" fill="#12153A" stroke="#3A4180" stroke-dasharray="3 4"/>
    <path d="M896 346l8-5 8 5v10l-8 5-8-5z" fill="none" stroke="#8FA8FF" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="920" y="357" class="ink" font-size="16" font-weight="600">Glirastes Platform</text>
    <text x="1144" y="357" class="mute" font-size="13" text-anchor="end">optional</text>
    <text x="920" y="381" class="soft" font-size="15">signed revisions, rollouts</text>
    <text x="920" y="401" class="soft" font-size="15">content-free telemetry</text>
    <text x="920" y="420" class="mono mute" font-size="13">no prompts, no data</text>
  </g>
  <path d="M844 378H880" fill="none" stroke="#8FA8FF" stroke-opacity=".7" stroke-width="1.2"/>
  <circle cx="844" cy="378" r="3" fill="#8FA8FF"/>
</svg>
